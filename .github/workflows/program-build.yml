name: Program build

on:
  push:
    paths:
      - ".github/workflows/program-build.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "programs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Check versions
        run: |
          rustc --version
          solana --version
          cargo-build-sbf --version
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build SBF program
        run: cargo-build-sbf --manifest-path programs/dreadtide/Cargo.toml --tools-version v1.57 --arch v3 -- --locked
      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: dreadtide-sbf
          path: target/deploy/dreadtide.so
          if-no-files-found: error
